:root {
  --ink: #3a2537;
  --shell: #f6c1e1;
  --shell-dk: #eaa5cf;
  --glass: #fad3eb;
  --key: #fdf8fb;
  --key-dk: #e7d8e2;
  --page: #fff5fa;
  --dots: rgba(232, 150, 196, .35);
  --page-ink: #8a5a79;
  --w: min(94vw, 640px, calc((100vh - 6rem) * 2.27));
}
@media (prefers-color-scheme: dark) {
  :root { --page: #1e1521; --dots: rgba(255, 255, 255, .07); --page-ink: #d9b6cd; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  background-color: var(--page);
  background-image: radial-gradient(circle, var(--dots) 1.5px, transparent 2px);
  background-size: 24px 24px;
  color: var(--page-ink);
  font-family: PJS, "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.stage { display: grid; justify-items: center; padding: 3rem 16px; }
/* macOS app: transparent window, only the console shows */
html.app, html.app body { background: transparent; }
html.app body { overflow: hidden; }
html.app .stage { padding: 0; }
html.app .console { --w: calc(100vw - 56px); }

/* ---------- console body ---------- */
.console {
  position: relative;
  width: var(--w);
  height: calc(var(--w) * .44);
  font-size: calc(var(--w) / 100); /* 1em = 1% of the console width */
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.console.rumble { animation: rumble .4s ease-in-out 2; }
@keyframes rumble {
  25% { transform: translateX(-.35em) rotate(-.4deg); }
  75% { transform: translateX(.35em) rotate(.4deg); }
}
.console button {
  -webkit-appearance: none;
  appearance: none;
  margin: 0;
  padding: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.console button:focus-visible { outline: .3em solid #7cb8ff; outline-offset: .25em; }
.console svg { display: block; overflow: visible; }

.shell {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: var(--shell);
  border: .32em solid var(--ink);
  border-radius: 9.5em;
  box-shadow:
    inset 0 .8em 0 rgba(255, 255, 255, .4),
    inset 0 -1em 0 rgba(200, 90, 150, .14),
    0 2em 3em -1em rgba(190, 80, 140, .35);
}
.shoulder {
  position: absolute;
  top: -.95em;
  z-index: 0;
  width: 17em;
  height: 8em;
  background: var(--shell-dk);
  border: .32em solid var(--ink);
  transition: transform .08s;
}
.shoulder.l { left: 2em; border-radius: 8.5em 2.2em 0 0 / 7em 2em 0 0; }
.shoulder.r { right: 2em; border-radius: 2.2em 8.5em 0 0 / 2em 7em 0 0; }
.shoulder.press { transform: translateY(.45em); }

/* ---------- buttons ---------- */
.key {
  position: absolute;
  z-index: 2;
  background: var(--key);
  border: .3em solid var(--ink);
  box-shadow: inset 0 -.35em 0 var(--key-dk), 0 .3em 0 var(--shell-dk);
  transition: transform .08s, box-shadow .08s;
}
.key.press {
  transform: translateY(.22em);
  box-shadow: inset 0 -.15em 0 var(--key-dk), 0 .08em 0 var(--shell-dk);
}
.minus { left: 11.8em; top: 5.4em; width: 2.8em; height: 1.25em; border-radius: 99em; }
.capture { left: 11.6em; top: 35.6em; width: 2.8em; height: 2.8em; border-radius: .6em; }
.capture::after {
  content: "";
  position: absolute;
  inset: .5em;
  border-radius: 50%;
  background: var(--key-dk);
  border: .18em solid rgba(58, 37, 55, .3);
}
.home { left: 85.3em; top: 35.3em; width: 3.4em; height: 3.4em; border-radius: 50%; display: grid; place-items: center; }
.home svg { width: 1.8em; height: 1.8em; }
.home.glow { animation: led 2.4s ease-in-out infinite; }
@keyframes led {
  50% { box-shadow: inset 0 -.35em 0 var(--key-dk), 0 0 0 .35em #ff7ab8, 0 0 1.6em .5em rgba(255, 90, 170, .6); }
}
.face { width: 4em; height: 4em; border-radius: 50%; display: grid; place-items: center; }
.face span { font-size: 2em; font-weight: 800; line-height: 1; }
.face.x { left: 89.4em; top: 7.4em; }
.face.y { left: 85.4em; top: 11.4em; }
.face.a { left: 93.4em; top: 11.4em; }
.face.b { left: 89.4em; top: 15.4em; }
.plus { position: absolute; z-index: 2; left: 85.25em; top: 4.45em; width: 3.1em; height: 3.1em; background: none; border: 0; }
.plus svg, .dpad svg { width: 100%; height: 100%; filter: drop-shadow(0 .3em 0 var(--shell-dk)); transition: transform .08s; }
.plus.press svg { transform: translateY(.22em); }

.dpad { position: absolute; z-index: 2; left: 3.6em; top: 22em; width: 10em; height: 10em; }
.dpad svg { position: absolute; inset: 0; }
.dpad button { position: absolute; width: 3.4em; height: 3.6em; background: none; border: 0; border-radius: .6em; }
.dpad [data-btn="up"] { left: 3.3em; top: 0; }
.dpad [data-btn="down"] { left: 3.3em; bottom: 0; }
.dpad [data-btn="left"], .dpad [data-btn="right"] { width: 3.6em; height: 3.4em; top: 3.3em; }
.dpad [data-btn="left"] { left: 0; }
.dpad [data-btn="right"] { right: 0; }
.dpad:has([data-btn="up"].press) svg { transform: perspective(30em) rotateX(14deg); }
.dpad:has([data-btn="down"].press) svg { transform: perspective(30em) rotateX(-14deg); }
.dpad:has([data-btn="left"].press) svg { transform: perspective(30em) rotateY(-14deg); }
.dpad:has([data-btn="right"].press) svg { transform: perspective(30em) rotateY(14deg); }

.stick {
  position: absolute;
  z-index: 2;
  width: 8em;
  height: 8em;
  border-radius: 50%;
  background: var(--key-dk);
  border: .3em solid var(--ink);
  box-shadow: 0 .3em 0 var(--shell-dk);
  cursor: grab;
  touch-action: none;
}
.stick.l { left: 4.6em; top: 9.4em; }
.stick.r { left: 87.4em; top: 23em; }
.cap {
  position: absolute;
  inset: .7em;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 38%, #fff 0 40%, #efe3eb 75%);
  border: .28em solid var(--ink);
  box-shadow: 0 .3em 0 rgba(58, 37, 55, .18);
  transition: transform .35s cubic-bezier(.3, 1.8, .5, 1), scale .1s;
}
.cap::after { content: ""; position: absolute; inset: 1.1em; border-radius: 50%; border: .22em solid rgba(58, 37, 55, .13); }
.stick.drag { cursor: grabbing; }
.stick.drag .cap { transition: scale .1s; scale: .95; }

/* ---------- screen ---------- */
.glass {
  position: absolute;
  z-index: 2;
  left: 16em;
  top: 3em;
  width: 68em;
  height: 38em;
  background: var(--glass);
  border: .26em solid var(--ink);
  border-radius: 1.8em;
  box-shadow: inset 0 .4em 0 rgba(255, 255, 255, .55);
}
.screen {
  --wall: #f3aad4;
  --acc: #ff4f9a;
  position: absolute;
  inset: 0;
  margin: auto;
  width: 59.8em;
  height: 33.9em;
  overflow: hidden;
  border: .3em solid var(--ink);
  border-radius: .5em;
  background-color: var(--wall);
  background-image:
    radial-gradient(circle 11em at 12% 80%, rgba(255, 255, 255, .22) 98%, transparent 100%),
    radial-gradient(circle 13em at 90% 14%, rgba(255, 255, 255, .22) 98%, transparent 100%),
    radial-gradient(circle 6em at 64% 92%, rgba(255, 255, 255, .22) 98%, transparent 100%),
    radial-gradient(circle 7em at 34% 6%, rgba(255, 255, 255, .22) 98%, transparent 100%),
    radial-gradient(circle 4em at 80% 62%, rgba(255, 255, 255, .22) 98%, transparent 100%);
  transition: background-color .6s;
}
.screen[data-theme="break"] { --wall: #a4d8f3; --acc: #2f9fe0; }
.screen[data-theme="count"] { --wall: #cbb6f4; --acc: #8a5de8; }
.screen::after { content: ""; position: absolute; inset: 0; z-index: 8; background: #fff; opacity: 0; pointer-events: none; }
.screen.snap::after { animation: snap .5s ease-out; }
@keyframes snap { from { opacity: .9; } }

.t { font-size: 2em; font-weight: 700; letter-spacing: .01em; }
.topbar, .bottombar { position: absolute; left: 0; right: 0; z-index: 3; display: flex; align-items: center; padding: 0 2.2em; }
.topbar { top: 0; height: 5.6em; justify-content: space-between; }
.tb-home, .tb-app, .tb-right { display: flex; align-items: center; gap: 1em; }
.tb-app, .snd { background: none; border: 0; }
[data-hint], .field { cursor: pointer; }
.screen[data-screen="home"] .tb-app, .screen:not([data-screen="home"]) .tb-home { display: none; }
.avatar { width: 3.8em; height: 3.8em; display: grid; place-items: center; border: .22em solid var(--ink); border-radius: 50%; background: #fff; }
.avatar svg { width: 2.7em; height: 2.7em; }
.tb-app svg { width: 3em; height: 3em; }
.tb-right svg { width: 2.7em; height: 2.7em; }

<script>
const MODES = { 50: [50, 10], 25: [25, 5] }; // pomodoro presets: [focus, break] in minutes
const KEY = 'pomolite:v1';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const now = () => Date.now();
const two = n => String(n).padStart(2, '0');
const mins = ph => MODES[P.mode][ph === 'focus' ? 0 : 1];
const dur = ph => mins(ph) * 60000;
const DIRS = ['up', 'down', 'left', 'right'];

const S = Object.assign({
  screen: 'home', sel: 0, muted: false,
  pomo: { mode: 50, phase: 'focus', running: false, endAt: 0, left: 50 * 60000, sessions: 0 },
  count: { set: 15 * 60, field: 1, status: 'idle', endAt: 0, left: 0 },
}, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
const P = S.pomo, C = S.count;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

if (!MODES[P.mode]) P.mode = 50; // saved before 25/5 existed

// the page was closed while a timer ran: move on to the next phase, paused
if (P.running && now() >= P.endAt) { flip(true); P.running = false; P.left = dur(P.phase); }
if (C.status === 'running' && now() >= C.endAt) { C.status = 'done'; C.left = 0; }

function flip(counted) {
  if (P.phase === 'focus') { if (counted) P.sessions++; P.phase = 'break'; }
  else P.phase = 'focus';
}
const pLeft = () => P.running ? Math.max(0, P.endAt - now()) : P.left;
const cLeft = () => C.status === 'running' ? Math.max(0, C.endAt - now()) : C.left;

/* ---------- sound ----------
   Alarms are scheduled on the Web Audio clock instead of setTimeout,
   so they still ring on time while the tab is in the background. */
let ac = null, syncOff = 0;
const armed = { pomo: [], count: [] };
const native = window.webkit?.messageHandlers?.alarm; // only inside the macOS app, which rings alarms natively
const MELODY = {
  break: [659.3, 830.6, 987.8, 1318.5],
  focus: [523.3, 659.3, 784.0, 1046.5],
  count: [880.0, 1108.7, 1318.5, 1760.0],
};
function audio() {
  if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; ac = new A(); }
  if (ac.state !== 'running') ac.resume().catch(() => {});
}
const live = () => ac && ac.state === 'running' && !S.muted;
function tone(f, at, len, vol, bag) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle';
  o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, at + len);
  o.connect(g).connect(ac.destination);
  o.start(at);
  o.stop(at + len + 0.05);
  bag.push({ o, at });
}
function blip() {
  if (!live()) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(1500, t);
  o.frequency.exponentialRampToValueAtTime(750, t + 0.045);
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + 0.07);
}
// keep = let a chime that is already sounding finish (automatic phase changes)
function arm(kind, keep) {
  if (native) {
    const on = kind === 'pomo' ? P.running : C.status === 'running';
    return native.postMessage({ kind, stop: !keep, muted: S.muted, endAt: on ? (kind === 'pomo' ? P.endAt : C.endAt) : 0, phase: P.phase, focus: dur('focus'), brk: dur('break') });
  }
  for (const n of armed[kind]) if (!keep || n.at > ac.currentTime) try { n.o.stop(); } catch {}
  armed[kind] = [];
  const on = kind === 'pomo' ? P.running : C.status === 'running';
  if (!on || !live()) return;
  const end = kind === 'pomo' ? P.endAt : C.endAt;
  const at = ac.currentTime + (end - now()) / 1000;
  if (at < ac.currentTime) return;
  const notes = kind === 'count' ? MELODY.count : MELODY[P.phase === 'focus' ? 'break' : 'focus'];
  const reps = kind === 'count' ? 3 : 2;
  for (let r = 0; r < reps; r++) notes.forEach((f, i) => tone(f, at + r * 0.9 + i * 0.13, 0.55, 0.14, armed[kind]));
}
// reschedule when the audio clock drifts (laptop sleep, audio just started, ...)
function resync() {
  if (native || !ac || ac.state !== 'running') return;
  const off = now() / 1000 - ac.currentTime;
  if (Math.abs(off - syncOff) > 1) { syncOff = off; arm('pomo', true); arm('count', true); }
}

/* ---------- actions ---------- */
function pomoToggle() {
  if (P.running) { P.left = pLeft(); P.running = false; }
  else { P.endAt = now() + P.left; P.running = true; }
  arm('pomo');
}
function pomoReset() {
  if (P.running || P.left !== dur(P.phase)) { P.running = false; P.left = dur(P.phase); }
  else if (P.phase !== 'focus' || P.sessions) { P.phase = 'focus'; P.sessions = 0; P.left = dur('focus'); toast('Sessions cleared'); }
  arm('pomo');
}
function pomoSkip() {
  flip(false);
  P.left = dur(P.phase);
  if (P.running) P.endAt = now() + P.left;
  arm('pomo');
}
function pomoMode() {
  if (P.running) return toast('Pause to switch mode');
  P.mode = P.mode === 50 ? 25 : 50;
  P.phase = 'focus';
  P.left = dur('focus');
  arm('pomo');
  toast(`${mins('focus')} · ${mins('break')} mode`);
}
function countToggle() {
  if (C.status === 'running') { C.left = cLeft(); C.status = 'paused'; }
  else if (C.status === 'paused') { C.endAt = now() + C.left; C.status = 'running'; }
  else if (!C.set) return toast('Set a time first');
  else { C.left = C.set * 1000; C.endAt = now() + C.left; C.status = 'running'; }
  arm('count');
}
function countReset() { C.status = 'idle'; C.left = 0; arm('count'); }
function bump(f, d) {
  const v = [Math.floor(C.set / 3600), Math.floor(C.set / 60) % 60, C.set % 60], max = [24, 60, 60];
  v[f] = (v[f] + d + max[f]) % max[f];
  C.set = v[0] * 3600 + v[1] * 60 + v[2];
}
function go(scr) { S.screen = scr; if (scr !== 'home') S.sel = scr === 'count' ? 1 : 0; }

function handle(b) {
  if (b === 'minus') { S.muted = !S.muted; arm('pomo'); arm('count'); return toast(S.muted ? 'Sound off' : 'Sound on'); }
  if (b === 'capture') { const s = $('#screen'); s.classList.remove('snap'); void s.offsetWidth; s.classList.add('snap'); return; }
  if (b === 'home') return go('home');
  if (b === 'L' || b === 'R') return S.screen === 'home' ? (S.sel ^= 1) : go(S.screen === 'pomo' ? 'count' : 'pomo');
  if (S.screen === 'home') {
    if (b === 'left' || b === 'right') S.sel ^= 1;
    else if (b === 'a') go(S.sel ? 'count' : 'pomo');
    return;
  }
  if (S.screen === 'pomo') {
    if (b === 'a') pomoToggle();
    else if (b === 'b') pomoReset();
    else if (b === 'y') pomoSkip();
    else if (b === 'x') pomoMode();
    return;
  }
  if (b === 'a') countToggle();
  else if (b === 'b') countReset();
  else if (C.status === 'idle' && DIRS.includes(b)) {
    if (b === 'left') C.field = (C.field + 2) % 3;
    else if (b === 'right') C.field = (C.field + 1) % 3;
    else bump(C.field, b === 'up' ? 1 : -1);
  }
}
function wake() { audio(); blip(); $('#boot').classList.add('gone'); }
function press(b) { wake(); handle(b); save(); render(); }
function flash(b) {
  const el = document.querySelector(`[data-btn="${b}"]`);
  if (!el) return;
  el.classList.add('press');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('press'), 140);
}

let toastT, glowUntil = 0;
function toast(msg) {
  const el = $('#toast');
  el.querySelector('.t').textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 3200);
}
function alertMe(msg) {
  toast(msg);
  glowUntil = now() + 8000;
  const c = $('#console');
  c.classList.remove('rumble'); void c.offsetWidth; c.classList.add('rumble');
}

/* ---------- loop ---------- */
function tick() {
  const t = now();
  if (P.running && t >= P.endAt) {
    while (t >= P.endAt) { flip(true); P.endAt += dur(P.phase); }
    if (!native) arm('pomo', true); // the macOS app schedules the whole cycle itself
    save();
    alertMe(P.phase === 'break' ? `Break time · ${mins('break')} min` : 'Back to focus');
  }
  if (C.status === 'running' && t >= C.endAt) {
    C.status = 'done'; C.left = 0;
    save();
    alertMe("Time's up");
  }
  resync();
  render();
}

/* ---------- render ---------- */
const mmss = ms => { const s = Math.ceil(ms / 1000); return two(Math.floor(s / 60)) + ':' + two(s % 60); };
const hms = s => [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(two);
function txt(el, v) { if (el._v !== v) { el._v = v; el.textContent = v; } }
function attr(el, k, v) { if (el.getAttribute(k) !== v) el.setAttribute(k, v); }
// digits are SVG text so the outline is a real vector stroke (text-shadow outlines look jagged in Chrome)
function digits(el, str) {
  if (el._v === str) return;
  el._v = str;
  let x = 0, spans = '';
  for (const ch of str) {
    const w = ch === ':' ? 34 : 66;
    spans += `<tspan x="${x + w / 2}" y="${ch === ':' ? -5 : 0}">${ch}</tspan>`;
    x += w;
  }
  el.innerHTML = `<svg viewBox="-7 -79 ${x + 14} 95" style="width:${(x + 14) / 100}em;height:.95em" aria-hidden="true">`
    + '<g text-anchor="middle" stroke="#3a2537" stroke-width="10" stroke-linejoin="round" paint-order="stroke">'
    + `<text transform="translate(0 7)" fill="#3a2537">${spans}</text><text fill="#fff">${spans}</text></g></svg>`;
  el.setAttribute('aria-label', str);
}
function badge(el, text, on) {
  el.hidden = !text;
  txt(el.lastElementChild, text);
  el.classList.toggle('on', on);
}
function hint([g, label]) {
  const glyph = g === 'dpad' ? '<svg><use href="#i-dpad"/></svg>' : `<b>${g.toUpperCase()}</b>`;
  const inner = `<span class="g">${glyph}</span><span class="t">${label}</span>`;
  return g === 'dpad' ? `<span class="hint">${inner}</span>` : `<button class="hint" data-hint="${g}">${inner}</button>`;
}

function render() {
  const scr = $('#screen'), t = now();
  scr.dataset.screen = S.screen;
  scr.dataset.theme = S.screen === 'pomo' ? P.phase : S.screen;
  const d = new Date();
  txt($('#clock'), two(d.getHours()) + ':' + two(d.getMinutes()));
  attr($('#snd use'), 'href', S.muted ? '#i-mute' : '#i-snd');
  txt($('#appName'), S.screen === 'count' ? 'Countdown' : 'Pomodoro');
  attr($('#appIcon use'), 'href', S.screen === 'count' ? '#i-glass' : '#i-tomato');

  // pomodoro
  const pl = pLeft(), full = dur(P.phase), pm = mmss(pl), pPaused = !P.running && pl < full;
  digits($('#pomoTime'), pm);
  txt($('#pomoPhase'), P.phase === 'focus' ? 'Focus' : 'Break');
  $('#pomoBar').style.width = (100 - 100 * pl / full).toFixed(2) + '%';
  txt($('#pomoCount'), '× ' + P.sessions);
  const modeTxt = `${mins('focus')} · ${mins('break')}`;
  txt($('#pomoMode'), modeTxt);
  txt($('#pomoTag'), modeTxt);
  const pv = $('.pomo-view');
  pv.classList.toggle('running', P.running);
  pv.classList.toggle('paused', pPaused);

  // countdown
  const cl = cLeft(), cs = C.status === 'idle' ? C.set : Math.ceil(cl / 1000);
  hms(cs).forEach((v, i) => digits($('#cf' + i), v));
  $$('.field').forEach((f, i) => f.classList.toggle('sel', C.status === 'idle' && C.field === i));
  txt($('#countStatus'), { idle: 'Set timer', running: 'Running', paused: 'Paused', done: "Time's up" }[C.status]);
  $('#countBar').style.width = (C.status === 'idle' || !C.set ? 0 : 100 - 100 * cl / (C.set * 1000)).toFixed(2) + '%';
  const cv = $('.count-view');
  ['idle', 'running', 'paused', 'done'].forEach(s => cv.classList.toggle(s, C.status === s));

  // home
  $$('.tile').forEach((el, i) => el.classList.toggle('sel', S.sel === i));
  txt($('#homeTitle'), S.sel ? 'Countdown' : 'Pomodoro');
  badge($('#pomoLive'), P.running || pPaused ? pm : '', P.running);
  const cRun = C.status === 'running' || C.status === 'paused';
  badge($('#countLive'), cRun ? hms(cs).join(':').replace(/^00:/, '') : C.status === 'done' ? '00:00' : '', C.status === 'running');

  // hints
  const H = S.screen === 'home' ? [['dpad', 'Select'], ['a', 'Open']]
    : S.screen === 'pomo' ? [['y', 'Skip'], ['b', 'Reset'], ['a', P.running ? 'Pause' : pPaused ? 'Resume' : 'Start']]
    : C.status === 'idle' ? [['dpad', 'Set'], ['a', 'Start']]
    : [['b', 'Reset'], ['a', { running: 'Pause', paused: 'Resume', done: 'Again' }[C.status]]];
  const hs = $('#hints'), hk = JSON.stringify(H);
  if (hs._v !== hk) { hs._v = hk; hs.innerHTML = H.map(hint).join(''); }

  $('[data-btn="home"]').classList.toggle('glow', C.status === 'done' || t < glowUntil);
  const title = C.status === 'running' && (S.screen === 'count' || !P.running) ? `${hms(cs).join(':')} · Countdown`
    : P.running ? `${pm} · ${P.phase === 'focus' ? 'Focus' : 'Break'}`
    : C.status === 'done' ? "Time's up · Pomo Lite" : 'Pomo Lite';
  if (document.title !== title) document.title = title;
}

/* ---------- input ---------- */
$$('[data-btn]').forEach(el => {
  const b = el.dataset.btn;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.classList.add('press');
    press(b);
    if (b === 'up' || b === 'down') el._rep = setTimeout(function rep() { press(b); el._rep = setTimeout(rep, 75); }, 400);
  });
  const up = () => { el.classList.remove('press'); clearTimeout(el._rep); };
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, up));
});

// the sticks can be dragged and work like the D-pad
$$('.stick').forEach(st => {
  const cap = st.firstElementChild;
  let o = null, fired = null;
  st.addEventListener('pointerdown', e => { o = { x: e.clientX, y: e.clientY }; st.setPointerCapture(e.pointerId); st.classList.add('drag'); wake(); });
  st.addEventListener('pointermove', e => {
    if (!o) return;
    const R = st.offsetWidth * .18, d0 = Math.hypot(e.clientX - o.x, e.clientY - o.y), k = Math.min(1, R / (d0 || 1));
    const dx = (e.clientX - o.x) * k, dy = (e.clientY - o.y) * k;
    cap.style.transform = `translate(${dx}px, ${dy}px)`;
    const dir = d0 < R * .8 ? null : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (dir && dir !== fired) press(dir);
    fired = dir;
  });
  const end = () => { o = null; fired = null; cap.style.transform = ''; st.classList.remove('drag'); };
  st.addEventListener('pointerup', end);
  st.addEventListener('pointercancel', end);
});

// touch screen: tiles, hints, timer, countdown arrows
$$('.tile').forEach((el, i) => el.addEventListener('pointerdown', e => {
  e.preventDefault(); wake(); S.sel = i; go(i ? 'count' : 'pomo'); save(); render();
}));
$('#screen').addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-hint]');
  if (!h) return;
  e.preventDefault(); flash(h.dataset.hint); press(h.dataset.hint);
});
$$('.field').forEach((el, i) => el.addEventListener('pointerdown', () => {
  if (C.status === 'idle') { C.field = i; render(); } else { flash('a'); press('a'); }
}));
$$('.arr').forEach(el => {
  const dir = el.dataset.d;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    C.field = +el.dataset.f;
    press(dir);
    el._rep = setTimeout(function rep() { press(dir); el._rep = setTimeout(rep, 75); }, 400);
  });
  const up = () => clearTimeout(el._rep);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.addEventListener(t, up));
});

// macOS app: dragging the console body moves the window
const dragMsg = window.webkit?.messageHandlers?.drag;
if (dragMsg) {
  let over = false;
  addEventListener('pointerover', e => {
    const o = e.target.classList.contains('shell') || e.target.classList.contains('glass');
    if (o !== over) dragMsg.postMessage(over = o);
  });
}

const KEYS = {
  ' ': 'a', enter: 'a', a: 'a', b: 'b', backspace: 'b', r: 'b', x: 'x', y: 'y', s: 'y',
  h: 'home', escape: 'home', m: 'minus', '-': 'minus', '=': 'plus', '+': 'plus', q: 'L', e: 'R', c: 'capture',
  arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const b = KEYS[e.key.toLowerCase()];
  if (!b) return;
  e.preventDefault();
  if (e.repeat && b !== 'up' && b !== 'down') return;
  flash(b);
  press(b);
});

navigator.getBattery?.().then(b => {
  const upd = () => { $('#batt i').style.width = Math.round(b.level * 100) + '%'; $('#batt').classList.toggle('chg', b.charging); };
  upd();
  b.addEventListener('levelchange', upd);
  b.addEventListener('chargingchange', upd);
}).catch(() => {});

$$('.colon').forEach(el => digits(el, ':'));
if (native) { arm('pomo', true); arm('count', true); }
render();
setInterval(tick, 250);
document.addEventListener('visibilitychange', tick);
</script>
</body>
</html>
